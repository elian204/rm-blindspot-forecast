[project]
name = "blindspots"
version = "0.1.0"
description = "Audit a reward model against a given LLM before RL training."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets>=4",
    "math-verify[antlr4-13-2]>=0.9",
    "numpy>=2",
    "pyyaml>=6",
    "torch>=2.14",
    "transformers>=5.16.1",
]

[project.optional-dependencies]
# Fast sampling on GPUs. Not needed for the CPU demo or the tests.
vllm = ["vllm>=0.33,<0.34"]

[tool.uv]
# Linux only: vLLM and the CUDA wheels are Linux-only.
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blindspots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads real models (CPU, minutes); skip with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "D"]
ignore = ["D203", "D213", "D105", "D107", "D301", "D400", "D401", "D415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D103"]
